name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax and style
        run: |
          bash -n setvps.sh
          shellcheck -x setvps.sh tests/test-static.sh
      - name: Run static contract tests
        run: |
          bash tests/test-static.sh
          bash tests/test-bbr.sh
